# 图谱提取提示词模板
# 用于知识图谱实体和关系提取
templates:
  - id: "default_extract_entities"
    name: "实体提取"
    description: "从文本中提取实体，用于知识图谱构建"
    default: true
    content: |
      ## 任务
      从用户提供的文本中提取所有符合以下实体类型的实体：
      实体类型: [人物, 组织, 地点, 产品, 事件, 日期, 作品, 概念, 资源, 类别, 操作]

      ## 要求
      1. 输出必须为 JSON 数组格式
      2. 每个实体必须包含 title 和 type 字段；description 字段为可选，但强烈建议填写
      3. type 字段值必须严格从实体类型列表中选择，不得创建新类型
      4. 如果无法确定实体类型，不要强行分类，宁可跳过该实体
      5. 不输出任何解释或附加内容，仅输出 JSON 数组
      6. 所有字段值不得包含 HTML 标签或其他代码
      7. 如果实体存在歧义，在 description 中注明所指
      8. 如果未找到实体，返回空数组 []

      ## 实体提取规则
      - 人物: 真实或虚构的人物角色，包括历史人物、现代人物、文学人物等
      - 组织: 公司、政府机构、团队、学校等组织实体
      - 地点: 地理位置、地标、国家、城市等
      - 产品: 商品、服务、品牌等商业产品
      - 事件: 活动、会议、节日、历史事件等
      - 日期: 日期、时间段、时代等时间相关信息
      - 作品: 书籍、电影、音乐、艺术品等创作作品
      - 概念: 抽象概念、思想、理论等
      - 资源: 自然资源、信息资源、工具等
      - 类别: 分类、类别、领域等
      - 操作: 运营、行动、方法、流程等

      ## 提取步骤
      1. 仔细阅读文本，识别可能的实体
      2. 对每个识别出的实体，确定最恰当的实体类型（必须从实体类型中选择）
      3. 为每个实体创建一个 JSON 对象，包含以下字段：
         - title: 实体的标准名称，不带引号等修饰符
         - type: 从实体类型中选择的实体类型
         - description: 对实体的简要描述，基于文本内容，与源文本语言一致
      4. 验证每个实体的所有字段是否正确、格式是否规范
      5. 将所有实体对象合并为一个 JSON 数组
      6. 检查最终的 JSON 是否有效并符合要求

      ## 关键: 语言规则
      - 实体标题严格按照源文本中的原样提取
      - 描述使用 {{language}} 书写

      ## 示例
      [输入]
      文本: "Romeo and Juliet" 是威廉·莎士比亚在其职业生涯早期创作的一部悲剧，讲述了两个来自敌对家族的意大利青年之间的爱情故事。在莎士比亚的有生之年，它是他最受欢迎的戏剧之一，也是他最常被搬上舞台的戏剧之一。该剧以意大利维罗纳为背景。两个主角罗密欧·蒙太古和朱丽叶·凯普莱特不顾家族的深仇大恨，深深相爱。

      [输出]
      [
        {
          "title": "Romeo and Juliet",
          "type": "作品",
          "description": "威廉·莎士比亚创作的一部悲剧，讲述了两个来自敌对家族的青年之间的爱情故事"
        },
        {
          "title": "威廉·莎士比亚",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的作者，在其职业生涯早期创作了该剧"
        },
        {
          "title": "罗密欧·蒙太古",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的两位主角之一，来自蒙太古家族"
        },
        {
          "title": "朱丽叶·凯普莱特",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的两位主角之一，来自凯普莱特家族"
        },
        {
          "title": "维罗纳",
          "type": "地点",
          "description": "《罗密欧与朱丽叶》故事发生的意大利城市"
        },
        {
          "title": "蒙太古",
          "type": "组织",
          "description": "剧中两个敌对家族之一，罗密欧的家族"
        },
        {
          "title": "凯普莱特",
          "type": "组织",
          "description": "剧中两个敌对家族之一，朱丽叶的家族"
        }
      ]

  - id: "default_extract_relationships"
    name: "关系提取"
    description: "提取实体之间的关系，用于知识图谱构建"
    default: true
    content: |
      ## 任务
      从用户提供的实体数组中，提取实体之间显式存在的关系，形成结构化的关系网络。

      ## 要求
      1. 关系提取必须基于提供的文本内容，不得虚构不存在的关系
      2. 输出必须为 JSON 数组格式，每个关系为数组中的一个对象
      3. 每个关系对象必须包含 source、target、description 和 strength 字段
      4. 不输出任何解释或附加内容，仅输出 JSON 数组
      5. 如果未找到关系，返回空数组 []

      ## 关系提取规则
      - 只提取文本中明确出现的关系
      - 源实体和目标实体必须是实体数组中已有的实体
      - 关系描述应简明地说明两个实体之间的具体关系
      - 关系强度应根据以下标准确定：
        * 10: 直接的创作/从属关系（如作者与作品、发明者与发明、母公司与子公司）
        * 9: 同一实体的不同表现形式（如别名、曾用名）
        * 8: 密切相关且相互影响的关系（如亲密伙伴、家庭成员）
        * 7: 明确但间接的关系（如作品中的角色、组织中的成员）
        * 6: 有明确联系的间接关联（如同事关系、相似产品）
        * 5: 相关但联系松散（如同一领域的不同概念）

      ## 提取步骤
      1. 仔细分析文本内容，确定哪些实体之间存在显式关系
      2. 只考虑文本中明确提到的关系，不得虚构
      3. 对每个找到的关系，确定：
         - source: 源实体的标题（必须是实体列表中已有的实体）
         - target: 目标实体的标题（必须是实体列表中已有的实体）
         - description: 简洁准确的关系描述
         - strength: 根据上述标准确定的关系强度（5-10 之间的整数）
      4. 检查每个关系是否双向：
         - 如果关系是双向的（如"A是B的朋友"意味着"B也是A的朋友"），考虑是否需要创建反向关系
         - 如果关系是单向的（如"A创作了B"），仅保留单向关系
      5. 验证所有关系的一致性和合理性：
         - 确保没有矛盾的关系（如A同时是B的父亲和兄弟）
         - 确保关系描述与关系强度匹配
      6. 将所有有效关系整理为 JSON 数组

      ## 关键: 语言规则
      - 关系描述使用 {{language}} 书写

      ## 示例
      [输入]
      实体: [
        {
          "title": "Romeo and Juliet",
          "type": "作品",
          "description": "威廉·莎士比亚创作的一部悲剧，讲述了两个来自敌对家族的青年之间的爱情故事"
        },
        {
          "title": "威廉·莎士比亚",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的作者，在其职业生涯早期创作了该剧"
        },
        {
          "title": "罗密欧·蒙太古",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的两位主角之一，来自蒙太古家族"
        },
        {
          "title": "朱丽叶·凯普莱特",
          "type": "人物",
          "description": "《罗密欧与朱丽叶》的两位主角之一，来自凯普莱特家族"
        },
        {
          "title": "维罗纳",
          "type": "地点",
          "description": "《罗密欧与朱丽叶》故事发生的意大利城市"
        },
        {
          "title": "蒙太古",
          "type": "组织",
          "description": "剧中两个敌对家族之一，罗密欧的家族"
        },
        {
          "title": "凯普莱特",
          "type": "组织",
          "description": "剧中两个敌对家族之一，朱丽叶的家族"
        }
      ]

      文本: "Romeo and Juliet" 是威廉·莎士比亚在其职业生涯早期创作的一部悲剧，讲述了两个来自敌对家族的意大利青年之间的爱情故事。在莎士比亚的有生之年，它是他最受欢迎的戏剧之一，也是他最常被搬上舞台的戏剧之一。该剧以意大利维罗纳为背景。两个主角罗密欧·蒙太古和朱丽叶·凯普莱特不顾家族的深仇大恨，深深相爱。


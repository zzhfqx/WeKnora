# 兜底模板
# 包含固定回复模板和模型兜底提示词模板。
# 固定回复：当 fallback_strategy = "fixed" 时直接用作回复
# 模型提示词：当 fallback_strategy = "model" 时用作大模型的提示词
templates:
  # --- 固定回复模板 ---
  - id: "default_fallback"
    name: "标准兜底"
    description: "友好告知无法回答并提供建议"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
      ja-JP:
        name: "標準フォールバック"
        description: "回答できないことを丁寧に伝え、提案を提示するメッセージ"
    default: true
    content: |
      抱歉，我在知识库中没有找到与您的问题直接相关的内容。

      您可以尝试：
      1. 换一种方式重新表述您的问题
      2. 提供更具体的信息
      3. 咨询相关领域的专业人士

      如果您还有其他问题，我很乐意继续为您提供帮助。

      ## 关键：语言规则
      - 始终使用 {{language}} 语言回复

  - id: "polite_fallback"
    name: "礼貌兜底"
    description: "更加礼貌详细的无法回答提示"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
      ja-JP:
        name: "丁寧なフォールバック"
        description: "より丁寧で詳細な回答不可メッセージ"
    content: |
      很抱歉，我目前无法对您的问题给出准确的回答。这可能是因为：
      - 问题超出了我的知识范围
      - 知识库中尚未包含相关内容

      建议：
      1. 尝试使用不同的关键词重新表述
      2. 将您的问题分解为更具体的子问题
      3. 联系客户支持寻求帮助

      感谢您的理解，期待能在其他问题上为您提供帮助！

      ## 关键：语言规则
      - 始终使用 {{language}} 语言回复

  - id: "brief_fallback"
    name: "简洁兜底"
    description: "简短的无法回答提示"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
      ja-JP:
        name: "簡潔なフォールバック"
        description: "短い回答不可メッセージ"
    content: "抱歉，我目前无法回答这个问题。请尝试重新表述您的问题，或联系客户支持。"

  # --- 模型兜底提示词模板（适用于 fallback_strategy = "model"）---
  - id: "model_fallback"
    name: "模型兜底提示"
    description: "引导模型基于通用知识回答的提示词"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
      ja-JP:
        name: "モデルフォールバックプロンプト"
        description: "一般知識に基づいて回答するようモデルを誘導するプロンプト"
    mode: "model"
    content: |
      通过搜索没有找到与用户查询直接匹配的内容。但是，知识库中包含以下文档：

      {{kb_documents}}

      重要提示：
      1. 如果上述文档列表可用，利用它来帮助回答用户的问题（例如，列出相关文档，建议哪些文档可能包含用户需要的信息）
      2. 如果文档列表为空，使用你的通用知识回答，并明确告知用户答案并非来自知识库
      3. 如果问题涉及特定领域或需要最新信息，建议用户查阅官方资源
      4. 回答中保持准确性和客观性

      ## 关键：语言规则
      - 始终使用 {{language}} 语言回复

      用户问题：{{query}}

  - id: "default_fallback_prompt"
    name: "标准兜底 Prompt"
    description: "知识库无相关结果时引导模型回答的默认提示词"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
      ja-JP:
        name: "標準フォールバックプロンプト"
        description: "ナレッジベースに関連する結果がない場合にモデルへ委ねるデフォルトのプロンプト"
    mode: "model"
    content: |
      你是 WeKnora，一款由腾讯研发的专业友好的AI助手。

      通过搜索没有找到与用户查询直接匹配的内容。但是，知识库中包含以下文档：

      {{kb_documents}}

      ## 回复要求
      - 如果上述文档列表可用，利用它来帮助回答用户的问题（例如，列出相关文档，建议哪些文档可能包含用户需要的信息，或总结知识库中已有的内容）
      - 如果文档列表为空或不相关，基于你的通用知识回答用户的问题，并明确告知用户答案并非来自知识库
      - 回答要简洁、清晰、有实质内容
      - 如果涉及实时数据或个人隐私信息，如实说明无法获取
      - 使用礼貌、专业的语气
      - 重要：始终使用 {{language}} 语言回复

      ## 用户问题：
      {{query}}
